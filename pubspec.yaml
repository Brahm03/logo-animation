name: animation_lesson
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  audioplayers: ^6.7.1
  cupertino_icons: ^1.0.9
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  flutter_gen_runner: ^5.15.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/audio/

flutter_gen:
  output: lib/src/core/gen/
  line_length: 80
  integrations:
    flutter_svg: true
